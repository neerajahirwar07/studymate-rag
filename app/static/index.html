<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyMate</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e3e3de; --accent:#2f5d50; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --card:#1f201e; --ink:#ecece8; --muted:#9a9a93; --line:#33342f; --accent:#7fb7a4; --warn:#e0a458; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  form.ask { display:flex; gap:8px; }
  input[type=text], textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); padding:6px 12px; }
  button:disabled { opacity:.5; cursor:default; }
  .answer { white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
  .warn { color:var(--warn); }
  .cite { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; font-size:.92rem; }
  .cite b { color:var(--accent); }
  details summary { cursor:pointer; color:var(--muted); }
  label { display:block; margin:10px 0 4px; font-size:.9rem; color:var(--muted); }
  ul.docs { padding-left:18px; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>StudyMate</h1>
  <p class="sub">Ask questions about your notes. Answers cite the passages they came from.</p>

  <div class="card">
    <form class="ask" id="askForm">
      <input type="text" id="question" placeholder="e.g. What is the time complexity of binary search?" minlength="3" maxlength="500" required>
      <button id="askBtn" type="submit">Ask</button>
    </form>
    <div id="result" hidden>
      <p class="answer" id="answer"></p>
      <div class="meta" id="meta"></div>
      <div id="cites"></div>
      <div class="meta" id="fb" hidden>Was this helpful?
        <button class="ghost" data-v="1">Yes</button> <button class="ghost" data-v="0">No</button>
        <span id="fbDone"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>Add a note</summary>
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="200">
      <label for="text">Text</label>
      <textarea id="text" rows="6"></textarea>
      <p><button id="addBtn" type="button">Save note</button> <span class="meta" id="addMsg"></span></p>
    </details>
    <details>
      <summary id="docsSummary">Notes</summary>
      <ul class="docs" id="docs"></ul>
    </details>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let lastQueryId = null;

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

$("askForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("askBtn").disabled = true;
  try {
    const data = await api("/ask", { method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({ question: $("question").value }) });
    lastQueryId = data.query_id;
    $("result").hidden = false;
    $("answer").textContent = data.answer;
    $("answer").className = "answer" + (data.grounded ? "" : " warn");
    $("meta").textContent = `${data.latency_ms} ms · answered by ${data.llm}`;
    $("cites").innerHTML = data.citations.map((c, i) =>
      `<div class="cite"><b>[${i + 1}] ${esc(c.title)}</b><br>${esc(c.text)}</div>`).join("");
    $("fb").hidden = !data.grounded;
    $("fbDone").textContent = "";
  } catch (err) {
    $("result").hidden = false;
    $("answer").textContent = "Error: " + err.message;
    $("answer").className = "answer warn";
    $("cites").innerHTML = ""; $("meta").textContent = ""; $("fb").hidden = true;
  } finally { $("askBtn").disabled = false; }
});

$("fb").addEventListener("click", async (e) => {
  const v = e.target.dataset && e.target.dataset.v;
  if (v === undefined || lastQueryId === null) return;
  try {
    await api("/feedback", { method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({ query_id: lastQueryId, helpful: v === "1" }) });
    $("fbDone").textContent = "Thanks!";
  } catch (err) { $("fbDone").textContent = err.message; }
});

async function loadDocs() {
  const docs = await api("/documents");
  $("docsSummary").textContent = `Notes (${docs.length})`;
  $("docs").innerHTML = docs.map((d) => `<li>${esc(d.title)} <span class="meta">· ${d.chunks} chunks</span></li>`).join("");
}

$("addBtn").addEventListener("click", async () => {
  $("addMsg").textContent = "";
  try {
    const r = await api("/documents", { method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({ title: $("title").value, text: $("text").value }) });
    $("addMsg").textContent = `Saved (${r.chunks} chunks)`;
    $("title").value = ""; $("text").value = "";
    loadDocs();
  } catch (err) { $("addMsg").textContent = err.message; }
});

loadDocs().catch(() => {});
</script>
</body>
</html>
